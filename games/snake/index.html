<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin: 10px 0; font-size: 20px; }
        #score { margin-bottom: 10px; color: #8f8; }
        canvas {
            background: #000;
            border: 2px solid #444;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
        }
        .hint { color: #888; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <div id="score">得分: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <p class="hint">用 ↑ ↓ ← → 或 WASD 控制方向</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const box = 20;
        const size = 20;
        let snake, dir, food, score, gameOver, started, timer;

        // ↓↓↓ 新增：从 URL 读 CSRF token ↓↓↓
        const urlParams = new URLSearchParams(window.location.search);
        // CSRF_TOKEN 已废弃（个人站不再有用户排行榜）

        function init() {
            snake = [{x: 10, y: 10}];
            dir = {x: 0, y: 0};
            score = 0;
            gameOver = false;
            started = false;
            placeFood();
            updateScore();
            clearInterval(timer);
            timer = setInterval(loop, 120);
            draw();
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * size),
                    y: Math.floor(Math.random() * size)
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function updateScore() {
            document.getElementById('score').textContent = '得分: ' + score;
        }

        function loop() {
            if (gameOver) return;
            if (!started) return;

            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= size || head.y < 0 || head.y >= size) {
                return endGame();
            }
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return endGame();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f33';
            ctx.fillRect(food.x * box, food.y * box, box, box);

            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#8f8' : '#4c4';
                ctx.fillRect(s.x * box, s.y * box, box - 1, box - 1);
            });

            if (!started && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('按方向键开始', canvas.width / 2, canvas.height / 2);
            }
        }

        function endGame() {
            gameOver = true;
            clearInterval(timer);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '16px sans-serif';
            ctx.fillText('得分: ' + score + '，按空格重来', canvas.width / 2, canvas.height / 2 + 25);

            submitScore(score);
        }

        function submitScore(s) {
            // 个人本地最高分（localStorage）
            const best = Math.max(s, parseInt(localStorage.getItem('snakeBest') || 0));
            localStorage.setItem('snakeBest', best);
            console.log('本次得分:', s, '历史最高:', best);
        }

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();

            if (k === ' ' && gameOver) {
                init();
                e.preventDefault();
                return;
            }

            let newDir = null;
            if (k === 'arrowup' || k === 'w') newDir = {x: 0, y: -1};
            else if (k === 'arrowdown' || k === 's') newDir = {x: 0, y: 1};
            else if (k === 'arrowleft' || k === 'a') newDir = {x: -1, y: 0};
            else if (k === 'arrowright' || k === 'd') newDir = {x: 1, y: 0};

            if (!newDir) return;
            if (dir.x + newDir.x === 0 && dir.y + newDir.y === 0) return;

            dir = newDir;
            started = true;
            e.preventDefault();
        });

        // 触屏：滑动手势控制方向
        let touchStart = null;
        document.addEventListener('touchstart', e => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (!touchStart) return;
            const dx = e.touches[0].clientX - touchStart.x;
            const dy = e.touches[0].clientY - touchStart.y;
            if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;

            let newDir;
            if (Math.abs(dx) > Math.abs(dy)) newDir = {x: dx > 0 ? 1 : -1, y: 0};
            else newDir = {x: 0, y: dy > 0 ? 1 : -1};

            if (dir.x + newDir.x === 0 && dir.y + newDir.y === 0) return;
            dir = newDir;
            started = true;
            touchStart = null;
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

        // 画布自适应：尽量占满可用宽高（普通/全屏都生效），上限 2.2 倍
        function fit() {
            const s = Math.max(0.6, Math.min((innerWidth - 36) / canvas.width, (innerHeight - 150) / canvas.height, 2.2));
            canvas.style.width = canvas.width * s + 'px';
            canvas.style.height = canvas.height * s + 'px';
        }
        window.addEventListener('resize', fit);
        fit();

        init();
    </script>
</body>
</html>
