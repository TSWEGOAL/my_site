{% extends "base.html" %}
{% block title %}关于我 - 孔亿欺的小站{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👤 关于我</h1>
    {% if is_admin_view %}
    <a href="{{ url_for('admin_edit_about') }}" class="btn btn-ghost btn-sm">
        ✏️ 编辑此页
    </a>
    {% endif %}
</div>

{% if page and page.updated_at %}
<p class="post-meta">最后更新：{{ page.updated_at.strftime('%Y-%m-%d %H:%M UTC') }}</p>
{% endif %}

<article class="post-content about-content">
    {{ content|safe }}
</article>

<div class="about-back">
    <a href="/">← 回到首页</a>
</div>
{% endblock %}
</content>
</invoke>
